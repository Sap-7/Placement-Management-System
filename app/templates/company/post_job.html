{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
<h4 class="mb-3">Post a job</h4>
<form method="post">{{ csrf() }}<div class="row g-3">
  <div class="col-md-8"><label class="form-label">Title</label><input name="title" class="form-control" required></div>
  <div class="col-md-4"><label class="form-label">Minimum CGPA</label><input type="number" step="0.01" min="0" max="10" name="min_cgpa" value="0" class="form-control"></div>
  <div class="col-12"><label class="form-label">Description</label><textarea name="description" rows="5" class="form-control" required></textarea></div>
  <div class="col-md-4"><label class="form-label">Application deadline</label><input type="datetime-local" name="deadline" class="form-control" min="{{ min_deadline }}" required></div>
</div><button class="btn btn-primary mt-4">Post</button> <a class="btn btn-link mt-4" href="{{ url_for('company.dashboard') }}">Cancel</a></form>
</div></div>
{% endblock %}
