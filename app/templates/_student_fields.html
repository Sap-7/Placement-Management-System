<div class="row g-3">
  <div class="col-md-4"><label class="form-label">Roll No</label>
    <input name="roll" class="form-control" value="{{ s.roll if s }}" {{ 'readonly' if s }} required></div>
  <div class="col-md-8"><label class="form-label">Full name</label>
    <input name="name" class="form-control" value="{{ s.name if s }}" required></div>
  <div class="col-md-6"><label class="form-label">Personal email</label>
    <input type="email" name="personalemail" class="form-control" value="{{ s.personalemail if s }}" required></div>
  <div class="col-md-6"><label class="form-label">College email (optional)</label>
    <input type="email" name="collegeemail" class="form-control" value="{{ s.collegeemail or '' if s }}"></div>
  <div class="col-md-3"><label class="form-label">CGPA</label>
    <input type="number" step="0.01" min="0" max="10" name="CGPA" class="form-control" value="{{ s.CGPA if s }}" required></div>
  <div class="col-md-3"><label class="form-label">10th %</label>
    <input type="number" step="0.01" name="marks_10" class="form-control" value="{{ s.marks_10 if s }}" required></div>
  <div class="col-md-3"><label class="form-label">12th % (optional)</label>
    <input type="number" step="0.01" name="marks_12" class="form-control" value="{{ s.marks_12 if s and s.marks_12 is not none }}"></div>
  <div class="col-md-3"><label class="form-label">Diploma % (optional)</label>
    <input type="number" step="0.01" name="diplomamarks" class="form-control" value="{{ s.diplomamarks if s and s.diplomamarks is not none }}"></div>
  <div class="col-md-4"><label class="form-label">Date of birth</label>
    <input type="date" name="DOB" class="form-control" value="{{ s.DOB.isoformat() if s }}" required></div>
  <div class="col-md-4"><label class="form-label">Gender</label>
    <select name="Gender" class="form-select">
      {% for g in ['Male','Female','Other'] %}<option {{ 'selected' if s and s.Gender == g }}>{{ g }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Mobile</label>
    <input name="mobileno" class="form-control" value="{{ s.mobileno if s }}" required></div>
  <div class="col-md-4"><label class="form-label">Course</label>
    <select name="courseid" class="form-select" required>
      {% for c in courses %}<option value="{{ c.courseid }}" {{ 'selected' if s and s.courseid == c.courseid }}>{{ c.name }}</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Stream</label>
    <select name="streamid" class="form-select" required>
      {% for st in streams %}<option value="{{ st.deptid }}" {{ 'selected' if s and s.streamid == st.deptid }}>{{ st.name }} ({{ st.course.name }})</option>{% endfor %}
    </select></div>
  <div class="col-md-4"><label class="form-label">Year of graduation</label>
    <input type="number" name="yearofgraduation" class="form-control" value="{{ s.yearofgraduation if s }}" required></div>
  {% if groups is defined %}
  <div class="col-md-6"><label class="form-label">Group (admin only)</label>
    <select name="groupid" class="form-select"><option value="">— none —</option>
      {% for g in groups %}<option value="{{ g.groupid }}" {{ 'selected' if s and s.groupid == g.groupid }}>{{ g.groupname }} ({{ g.stream.name }})</option>{% endfor %}
    </select></div>
  {% endif %}
  <div class="col-md-6"><label class="form-label">Password {{ '(leave blank to keep)' if s }}</label>
    <input type="password" name="password" class="form-control" minlength="6" {{ 'required' if not s }}></div>
</div>
